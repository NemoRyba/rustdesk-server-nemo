# Relay bandwidth caps, lifted from the stock 128 Mb/s per session so an on-path relay
# does not throttle a CAD session. Values are Mb/s.
#
# These are runtime-tunable over hbbr's loopback command port too, but a drop-in is
# what survives a restart -- and what a rebuilt machine inherits.
[Service]
Environment=SINGLE_BANDWIDTH=10000
Environment=TOTAL_BANDWIDTH=10000
Environment=LIMIT_SPEED=10000
