[package]
name = "hbbs"
version = "1.1.15"
authors = ["rustdesk <info@rustdesk.com>"]
edition = "2021"
build = "build.rs"
default-run = "hbbs"

[[bin]]
name = "hbbr"
path = "src/hbbr.rs"

[[bin]]
name = "rustdesk-utils"
path = "src/utils.rs"

[features]
default = ["nemo-management-api", "nemo-ldap", "nemo-tls"]
nemo-management-api = []
# LDAP (Windows-domain) login for the Nemo integration layer. Pulls in the
# `ldap3` crate; disable with `--no-default-features` if it can't build on a
# given target.
nemo-ldap = ["ldap3", "native-tls"]
# TLS termination for the Nemo management/login API so client credentials are
# never sent in cleartext. Pulls in `axum-server` (rustls) and `rcgen` for
# auto-generated self-signed certificates.
nemo-tls = ["axum-server", "rcgen"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hbb_common = { path = "libs/hbb_common" }
serde_derive = "1.0"
serde = "1.0"
serde_json = "1.0"
lazy_static = "1.4"
clap = "2"
rust-ini = "0.18"
minreq = { version = "2.4", features = ["punycode"] }
machine-uid = "0.2"
mac_address = "1.1.5"
whoami = "1.2"
base64 = "0.13"
axum = { version = "0.5", features = ["headers"] }
sqlx = { version = "0.6", features = [ "runtime-tokio-rustls", "sqlite", "macros", "chrono", "json" ] }
deadpool = "0.8"
async-trait = "0.1"
async-speed-limit = { git = "https://github.com/open-trade/async-speed-limit" }
uuid = { version = "1.0", features = ["v4"] }
bcrypt = "0.13"
chrono = "0.4"
jsonwebtoken = "8"
headers = "0.3"
once_cell = "1.8"
sodiumoxide = "0.2"
tokio-tungstenite = "0.17"
tungstenite = "0.17"
regex = "1.4"
tower-http = { version = "0.3", features = ["fs", "trace", "cors"] }
http = "0.2"
flexi_logger = { version = "0.22", features = ["async", "use_chrono_for_offset", "dont_minimize_extra_stacks"] }
ipnetwork = "0.20"
local-ip-address = "0.5.1"
dns-lookup = "1.0.8"
ping = "0.4.0"
flate2 = "1.0"
# LDAP client for Windows-domain login (Nemo integration). Uses native TLS
# (OpenSSL on Linux / SChannel on Windows) rather than rustls: Windows AD DCs
# often only offer TLS 1.2 with CBC cipher suites and reset rustls' TLS-1.3
# ClientHello ("connection reset by peer"), whereas native TLS negotiates with
# them cleanly. On Linux this needs libssl-dev + pkg-config at build time.
ldap3 = { version = "0.11", optional = true }
# Direct handle on the native-tls types (ldap3 already pulls this transitively)
# so we can pin/trust the DC's self-signed certificate and fetch it for review.
native-tls = { version = "0.2", optional = true }
# TLS-terminating HTTP server + self-signed certificate generation for the Nemo
# management/login API (encrypts client credentials in transit).
axum-server = { version = "0.4", features = ["tls-rustls"], optional = true }
rcgen = { version = "0.11", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# https://github.com/rustdesk/rustdesk-server-pro/issues/189, using native-tls for better tls support
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "native-tls", "gzip"], default-features=false }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
reqwest = { git = "https://github.com/rustdesk-org/reqwest", features = ["blocking", "socks", "json", "rustls-tls", "rustls-tls-native-roots", "gzip"], default-features=false }

[build-dependencies]
hbb_common = { path = "libs/hbb_common" }
# Adding ldap3 (native-tls) perturbed host-side (proc-macro/build) feature
# unification for syn 1.x, dropping the derive/parsing features sqlx-macros
# relies on. Pin them back on the host graph so sqlx-macros compiles.
syn = { version = "1", features = ["full", "extra-traits", "parsing", "printing", "derive", "clone-impls", "visit"] }

[workspace]
members = ["libs/hbb_common"]
exclude = ["ui"]

#https://github.com/johnthagen/min-sized-rust
#https://doc.rust-lang.org/cargo/reference/profiles.html#default-profiles
[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true
#opt-level = 'z' # only have smaller size after strip # Default is 3, better performance
#rpath = true # Not needed
